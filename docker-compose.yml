services:
  postgres:
    image: postgres:16
    container_name: ordercase-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ordercase-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: ordercase-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  ordering-api:
    build:
      context: .
      dockerfile: src/Services/Ordering/OrderCase.Ordering.Api/Dockerfile
    container_name: ordercase-ordering-api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__OrderingDb: "Host=postgres;Port=5432;Database=orderdb;Username=postgres;Password=postgres;GSS Encryption Mode=Disable"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  processing-worker:
    build:
      context: .
      dockerfile: src/Services/Processing/OrderCase.Processing.Worker/Dockerfile
    container_name: ordercase-processing-worker
    environment:
      ConnectionStrings__ProcessingDb: "Host=postgres;Port=5432;Database=processingdb;Username=postgres;Password=postgres;GSS Encryption Mode=Disable"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
